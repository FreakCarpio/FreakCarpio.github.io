<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- viewport-fit=cover lets the page paint under the notch; the CSS pads
         content back with env(safe-area-inset-*). Zoom is never disabled. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- Matches --color-bg, the color at the top of every page (dark-only site) -->
    <meta name="theme-color" content="#0a0a0a">
    <meta name="color-scheme" content="dark">

    <link rel="icon" href="/favicon.ico?v=c76a14f9" type="image/x-icon" sizes="16x16 32x32 48x48 64x64 128x128 256x256">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=c76a14f9" sizes="180x180">

    <link
        rel="preload"
        href="/assets/fonts/archivo-variable-latin.woff2"
        as="font"
        type="font/woff2"
        crossorigin
    >

    <!-- Restore the hero entrance preference before first paint. -->
    <script>
        try {
            if (sessionStorage.getItem('hero-seen')) {
                document.documentElement.dataset.heroSeen = '';
            }
        } catch (error) { /* storage blocked: the entrance simply replays */ }
    </script>

    <!--app-head-->
</head>

<body>
    <!-- The build prerenders each route into this element (scripts/prerender.mjs),
         so the content exists in the HTML before any JavaScript runs. -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
