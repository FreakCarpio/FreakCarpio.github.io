<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- GitHub Pages serves this file for any missing URL, at any depth
         (e.g. /projects/old-name/). Relative paths would break there, so
         this page uses root-absolute paths, valid on the user site. -->

    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0b0a09">

    <title>Page not found | Emilio Carpio</title>

    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <link
        rel="preload"
        href="/assets/fonts/archivo-variable-latin.woff2"
        as="font"
        type="font/woff2"
        crossorigin
    >

    <link rel="stylesheet" href="/css/styles.css">

    <script type="module" src="/js/main.js"></script>
</head>

<body>

    <a class="skip-link" href="#main">Skip to content</a>

    <!-- ==================== HEADER ==================== -->
    <!-- Keep in sync with /index.html (root-absolute paths here) -->
    <header class="site-header">
        <nav class="navbar" aria-label="Primary" data-js="navbar">

            <a href="/" class="logo">
                EC<span class="visually-hidden"> Emilio Carpio, home</span>
            </a>

            <button
                class="menu-toggle"
                type="button"
                data-js="menu-toggle"
                aria-expanded="false"
                aria-controls="site-menu"
                hidden
            >
                Menu
            </button>

            <ul class="nav-links" id="site-menu" data-js="menu">
                <li><a href="/#about">About</a></li>
                <li><a href="/#skills">Skills</a></li>
                <li><a href="/#projects">Work</a></li>
                <li><a href="/#contact">Contact</a></li>
            </ul>

        </nav>
    </header>


    <main id="main">

        <!-- An error gives direction: what happened and where to go next -->
        <header class="case-intro error-page">

            <h1 class="case-title">This page doesn't exist</h1>

            <p class="case-summary">
                The address may be mistyped, or the page has moved.
            </p>

            <p class="error-links">
                <a href="/" class="cta-link">Go to the home page</a>
                <a href="/#projects" class="cta-link">See selected work</a>
            </p>

        </header>

    </main>


    <!-- ==================== FOOTER ==================== -->
    <!-- Keep in sync with /index.html -->
    <footer class="site-footer">

        <p>© 2026 Emilio Carpio</p>

        <ul class="footer-links" role="list">
            <li><a href="https://github.com/FreakCarpio" rel="me">GitHub</a></li>
            <li><a href="https://www.linkedin.com/in/emilio-alejandro-carpio-guzm%C3%A1n/" rel="me">LinkedIn</a></li>
        </ul>

    </footer>

</body>
</html>
